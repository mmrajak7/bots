# Exchange trading holidays read by market_calendar.py (spec SPEC_multi_instrument_2026-10-06 §8, §9c).
#
# WHY this file exists: on 2026-10-02 (NSE closed) the bot ran 375 scans on a frozen tape. main()
# must not run on a closed session; the liquidity freshness gate is only the backstop.
#
# Layout:  <EXCHANGE>: <YEAR>: {source, note?, holidays: [{date, type, name}, ...]}
#   EXCHANGE  NSE (equity derivatives / F&O: NIFTY, BANKNIFTY) | MCX (commodity derivatives)
#   type      closed        - no trading at all
#             evening_only  - MCX only: morning session closed, evening session trades from 17:00
#             morning_only  - MCX only: morning session trades, closed from 17:00
# Weekdays only: weekends are closed by rule in market_calendar.day_type(), so the official lists'
# weekend holidays (2026: Feb 15, Mar 21, Aug 15, Nov 8) are omitted.
# A year with an empty holidays list counts as NOT covered -> coverage_problem() raises the alarm.
#
# Muhurat trading (Sunday 2026-11-08, timings announced separately) is a special session the bot
# does not trade; it is deliberately not modelled.
#
# Reviewed against local 1-min futures bars 2026-08-10..2026-10-06 (backtest_multi_2026-10-06/data):
# NSE no bars on 09-14 and 10-02; MCX bars only 17:00-23:29 on 09-14 and none on 10-02.

