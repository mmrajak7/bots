# =============================================================================
# SNAIL Configuration
# =============================================================================
# @file        config.yaml
# @description Main configuration file for SNAIL trading system
# @author      SNAIL Development Team
# @created     2025-12-04
# @version     1.0.0
# @references  TECHNICAL_DESIGN.md Section 7
# =============================================================================
# Environment variables can be referenced as ${VAR_NAME}
# =============================================================================

# -----------------------------------------------------------------------------
# Trading Parameters
# -----------------------------------------------------------------------------
trading:
  instrument: "NIFTY"
  strategy: "iron_fly"

  # Capital allocation
  capital:
    allocated: 120000        # Total allocated capital in INR
    min_available: 100000    # Minimum required margin
    num_lots: 1              # Number of lots to trade

  # Entry conditions
  entry:
    vix_range:
      min: 10.0              # VIX must be >= 10
      max: 16.0              # VIX must be <= 16
      soft_min: 9.5          # Soft buffer lower
      soft_max: 16.5         # Soft buffer upper
    min_dte: 6               # Minimum days to expiry
    window:
      start: "09:30"         # Entry window start
      end: "15:10"           # Entry window end (3:10 PM)
    cooldown_days: 1         # Days to wait after exit
    slippage_ticks: 2        # Fixed slippage ticks
    use_tiered_slippage: false # Use progressive tiered slippage (TDD Section 1.3)

    # Risk:Reward filter (highest priority entry filter)
    # Only send entry alert if R:R meets this threshold
    # R:R = Max Loss / Max Profit (e.g., 0.5 means risk 1 to make 2)
    min_rr_ratio: 0.5        # Only enter if R:R <= 0.5 (1:2 or better)
    require_good_rr: false   # Enable R:R filter (set true for production)

    # Claude pre-entry advisory
    use_claude_advisory: false # Disable Claude analysis for pre-entry (set true to enable)

  # Exit conditions (based on Return on Margin - ROM)
  # All percentages are calculated on margin_deployed, not max_profit
  # This gives realistic P&L percentages based on capital at risk
  exit:
    profit_target_pct: 5     # Exit at 5% ROM (e.g., ₹5,000 on ₹1L margin)
    stop_loss_pct: 10        # Alert at 10% loss on margin (e.g., -₹10,000 on ₹1L margin)
    vix_hard_exit: 20        # Hard exit if VIX > 20
    vix_warning_zone: 16.5   # Warning if VIX > 16.5
    friday_check_time: "15:00"  # Friday exit decision time
    friday_exit_time: "15:15"   # Default Friday exit (if not held)
    expiry_exit_time: "15:20"   # Expiry day forced exit time
    cooldown_hours: 24          # Cooldown after exit

  # Wing approach thresholds
  wing_approach:
    early_warning_pct: 30    # Early warning at 30%
    advisory_pct: 40         # Claude advisory at 40%

  # Slippage tolerance (in points)
  slippage:
    entry_tier1: 2           # First attempt
    entry_tier2: 3           # Second attempt
    entry_tier3: 5           # Third attempt (then MARKET)
    exit_normal: 3           # Normal exit
    exit_urgent: 0           # Urgent exit (MARKET)
    timeout_seconds: 10      # Wait between tiers

  # Bid-ask spread thresholds
  spread:
    atm_warn: 2              # ATM warning threshold
    atm_block: 5             # ATM block threshold
    wing_warn: 5             # Wing warning threshold
    wing_block: 10           # Wing block threshold

# -----------------------------------------------------------------------------
# API Configuration
# -----------------------------------------------------------------------------
api:
  kite:
    api_key: ${ZERODHA_API_KEY}
    api_secret: ${ZERODHA_API_SECRET}
    user_id: ${ZERODHA_USER_ID}
    password: ${ZERODHA_PASSWORD}
    totp_secret: ${ZERODHA_TOTP_SECRET}
    # Shared token file - generated at 8:45 AM by scheduled task
    token_file: "../data/kite_access_token.json"

  claude:
    api_key: ${ANTHROPIC_API_KEY}
    haiku_model: "claude-3-haiku-20240307"
    sonnet_model: "claude-3-5-sonnet-20241022"
    max_tokens: 1024
    temperature: 0.3
    rate_limit_per_minute: 5

  telegram:
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
    max_message_length: 4096
    parse_mode: "Markdown"

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
# Shared paths (under BOTS/data) - accessible by all bots (CROCODILE, SNAIL, etc.)
# SNAIL-specific paths are under the project's own data folder
paths:
  # SNAIL-specific database
  database: "data/snail.db"

  # SNAIL-specific logs
  logs: "logs/snail.log"
  order_logs: "logs/orders.log"
  claude_logs: "logs/claude"
  prompts: "config/prompts"

  # SHARED: Kite token - generated at 8:45 AM, shared across all bots
  # This allows CROCODILE, SNAIL, and future bots to use the same session
  token: "../data/kite_access_token.json"

  # SNAIL-specific: NIFTY options instruments (NFO exchange)
  # NOT shared with CROCODILE which uses all NSE equities
  instruments: "data/instruments.csv"

  # SHARED: Holiday calendar - same for all bots
  holidays: "../data/holiday_calendar.json"

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level: <8} | {name}:{function}:{line} | {message}"
  rotation: "10 MB"
  retention: "30 days"
  compression: "zip"

# -----------------------------------------------------------------------------
# Monitoring & Alerts
# -----------------------------------------------------------------------------
monitoring:
  interval_minutes: 10       # Position check interval
  start_time: "09:16"        # Monitor start (after market opens)
  end_time: "15:26"          # Monitor end

  # Quote failure handling
  max_quote_failures: 3      # Max consecutive failures before pause
  retry_delay_seconds: 5     # Delay between retries

  # Alert deduplication intervals (hours)
  alert_cooldown:
    stop_loss: 1
    wing_approach: 1
    big_move: 1
    vix_warning: 1
    profit_milestone: 2
    system: 0.083            # 5 minutes

# -----------------------------------------------------------------------------
# Data Retention
# -----------------------------------------------------------------------------
retention:
  entry_attempts_days: 90    # Keep entry attempts for 90 days
  alert_queue_days: 30       # Keep alerts for 30 days
  pnl_snapshots: "forever"   # Never delete
  positions: "forever"       # Never delete
  claude_decisions: "forever" # Never delete

# -----------------------------------------------------------------------------
# Transaction Charges (verify periodically)
# -----------------------------------------------------------------------------
charges:
  brokerage_per_order: 20    # Zerodha flat fee
  stt_sell_rate: 0.000625    # 0.0625% on sell
  exchange_txn_rate: 0.000495 # 0.0495% NSE F&O
  gst_rate: 0.18             # 18%
  stamp_duty_buy_rate: 0.00003 # 0.003% on buy
  sebi_per_crore: 10         # ₹10 per crore

# -----------------------------------------------------------------------------
# Paper Trading Mode
# -----------------------------------------------------------------------------
paper_trading:
  enabled: ${SNAIL_PAPER_TRADING}
  log_orders: true           # Log simulated orders
  simulate_fills: true       # Simulate order fills
